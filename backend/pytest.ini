[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    -p no:cacheprovider
filterwarnings =
    ignore:The 'alias' attribute with value .* has no effect in the context it was used:UserWarning
    ignore:.*FieldAttributeWarning.*:Warning
